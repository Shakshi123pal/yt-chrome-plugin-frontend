<!DOCTYPE html>
<html>
<head>
  <title>YouTube Comment Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10px;
      background-color: #1e1e1e;
      color: #f1f1f1;
      width: 330px;
    }
    h1 { color: #4db8ff; font-size: 20px; }

    button {
      width: 100%;
      padding: 10px;
      background-color: #0099ff;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 12px 0;
    }

    button:hover { background-color: #007acc; }

    .comment-item {
      background-color: #333;
      padding: 8px;
      border-radius: 6px;
      margin: 6px 0;
    }
  </style>
</head>

<body>
  <h1>YouTube Comment Analyzer</h1>

  <!-- ✅ THIS BUTTON WAS MISSING -->
  <button id="sendRequest">Analyze Current Video</button>

  <div id="output">Click the button to start analysis.</div>

  <!-- ✅ JS AT BOTTOM -->
  <script src="popup.js"></script>
</body>
</html>
